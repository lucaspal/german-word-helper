<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152b42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="German Article">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>German Article</title>
</head>
<body>
  <main class="app">
    <header>
      <div><p class="eyebrow">GERMAN NOUNS</p><h1>Der, die oder das?</h1></div>
      <button id="installHelp" class="icon-button" aria-label="How to install">＋</button>
    </header>

    <section class="search card">
      <label for="word">Search a word</label>
      <div class="search-row"><input id="word" autocomplete="off" autocapitalize="words" placeholder="e.g. Bad" autofocus><button id="lookup" class="primary">Search</button></div>
      <p class="hint">Enter a German noun to see its article, English meaning and declension.</p>
    </section>

    <section id="result" class="card result" hidden aria-live="polite"></section>
    <p class="source">Dictionary data: German Wiktionary. Recent searches are cached on this device.</p>
  </main>
  <dialog id="installDialog"><h2>Add to Home Screen</h2><p>In Safari, tap <strong>Share</strong>, then choose <strong>Add to Home Screen</strong>.</p><button id="closeDialog" class="primary">Done</button></dialog>
  <script src="app.js"></script>
</body>
</html>
