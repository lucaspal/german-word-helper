name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/GermanArticle
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate project and shared scheme
        run: xcodebuild -project GermanArticle.xcodeproj -scheme GermanArticle -list
      - name: Validate app extension bundle metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' GermanArticleWidget/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' GermanArticleWidget/Info.plist
          ! grep -q 'NSExtensionPrincipalClass\|NSExtensionMainStoryboard' GermanArticleWidget/Info.plist
      - name: Run iOS and widget tests
        shell: bash
        run: |
          set -euo pipefail
          destination_id="$(xcrun simctl list devices available \
            | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$destination_id"
          xcodebuild test \
            -project GermanArticle.xcodeproj \
            -scheme GermanArticle \
            -destination "id=$destination_id" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
