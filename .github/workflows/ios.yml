name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/GermanArticle
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate project and shared scheme
        run: xcodebuild -project GermanArticle.xcodeproj -scheme GermanArticle -list
      - name: Run iOS and widget tests
        shell: bash
        run: |
          set -euo pipefail
          destination_id="$(xcodebuild -project GermanArticle.xcodeproj -scheme GermanArticle -showdestinations \
            | grep -oE 'platform:iOS Simulator[^}]*id:[A-F0-9-]{36}' \
            | sed -n 's/.*id:\([A-F0-9-]*\).*/\1/p' \
            | head -n 1)"
          test -n "$destination_id"
          xcodebuild test \
            -project GermanArticle.xcodeproj \
            -scheme GermanArticle \
            -destination "id=$destination_id" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
