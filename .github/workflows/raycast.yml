name: Raycast extension

on:
  push:
    paths:
      - "raycast/**"
      - ".github/workflows/raycast.yml"
  pull_request:
    paths:
      - "raycast/**"
      - ".github/workflows/raycast.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - run: npm ci
      - run: npm run verify:api
      - run: npm test -- --runInBand
      - run: npm run build